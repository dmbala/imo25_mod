# Model registry. Adding a hosted provider is an entry here, not code.
# ${VAR} and ${VAR:-fallback} are resolved from the environment at load time.
default: claude-opus-5

models:
  claude-opus-5:
    api: anthropic
    model: claude-opus-5
    key_env: ANTHROPIC_API_KEY
    max_tokens: 32000
    effort: high              # low | medium | high | xhigh | max
    thinking: adaptive
    fallbacks: true           # reroute instead of dying if a request is declined
    # no temperature: current Claude models reject it (400)

  claude-sonnet-5:
    api: anthropic
    model: claude-sonnet-5
    key_env: ANTHROPIC_API_KEY
    max_tokens: 32000
    effort: high
    thinking: adaptive

  # Runs through the `claude` CLI, so it uses an existing Claude Code login
  # instead of an API credential. Slower and dearer per call than the API --
  # Claude Code sends its own harness context every time -- but needs no key.
  # `model` takes an alias (opus, sonnet, fable) or a full model name.
  claude-code:
    api: claude_cli
    model: opus
    effort: high
    timeout: 1800

  # Anything OpenAI-compatible served on the cluster (vLLM, Ollama, SGLang).
  # No key_env: local servers usually run unauthenticated.
  local:
    api: openai_compat
    model: ${IMO_MODEL:-Qwen/Qwen3-32B}
    base_url: ${IMO_BASE_URL:-http://localhost:8000/v1}
    max_tokens: 32000
    max_tokens_param: max_tokens

  gemini-2.5-pro:
    api: openai_compat
    model: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GOOGLE_API_KEY
    max_tokens: 32000
    max_tokens_param: max_tokens
    effort: high

  gpt-5:
    api: openai_compat
    model: gpt-5
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    max_tokens: 32000
    effort: high

  grok-4:
    api: openai_compat
    model: grok-4-0709
    base_url: https://api.x.ai/v1
    key_env: XAI_API_KEY
    max_tokens: 32000
    max_tokens_param: max_tokens
    temperature: 0.1
    strip_preamble: true      # this family tends to chatter before **Summary**
