[project]
name = "imo25-mod"
version = "0.1.0"
description = "Config-driven, graph-based agent for olympiad problems"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
imo-solve = "imo_agent.cli:main"
imo-parallel = "imo_agent.parallel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
